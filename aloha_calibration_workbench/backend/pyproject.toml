[project]
name = "aloha-calibration-workbench-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.6",
  "httpx==0.28.1",
  "pydantic==2.11.5",
  "PyYAML==6.0.2",
  "uvicorn[standard]==0.34.0",
]

[project.scripts]
aloha-calibration-capture-agent = "calibration_workbench.capture_main:main"
aloha-calibration-orchestrator = "calibration_workbench.orchestrator_main:main"
aloha-calibration-preflight = "calibration_workbench.preflight_cli:main"

[dependency-groups]
dev = [
  "pytest==8.3.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["calibration_workbench"]
