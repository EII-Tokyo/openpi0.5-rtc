services:
  runtime:
    command: >-
      python3 /app/scripts/run_aloha_real.py
      --model-dir
      /app/checkpoints/eii_data_system_without_rinse_cam3_fullft_h200_return_home_29repo/no_rinse_cam3_fullft_return_home_29repo_bs256_nw64_fsdp4_20260520/19000
      --host 127.0.0.1 --port 8001
      --video-memory-num-frames 1 --video-memory-stride-seconds 1.0
      --chunking-mode inference_time --rtc-handoff-delay-steps 10
    environment:
      ALOHA_TASK_1_PROMPT: Twist off the bottle cap
      ALOHA_TASK_2_PROMPT: Rinse bottle

  openpi_server:
    entrypoint: ["/.venv/bin/python3"]
    command:
      - /app/scripts/serve_policy.py
      - --port
      - "8001"
      - --no-warmup-subtask
      - --denoising-steps
      - "10"
      - --video-memory-num-frames
      - "1"
      - --video-memory-stride-seconds
      - "1.0"
      - policy:checkpoint
      - --policy.config
      - eii_data_system_without_rinse_cam3_fullft_h200_return_home_29repo
      - --policy.dir
      - /app/checkpoints/eii_data_system_without_rinse_cam3_fullft_h200_return_home_29repo/no_rinse_cam3_fullft_return_home_29repo_bs256_nw64_fsdp4_20260520/19000
