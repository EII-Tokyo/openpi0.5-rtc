services:
  runtime:
    command: >-
      python3 /app/scripts/run_aloha_real.py
      --model-dir /app/checkpoints/eii_data_system_with_rinse_cam4_fullft_h200_from_april_original_30repo/rinse_cam4_april_30repo_44entries_448_bs64_ga4_scan_nw96_fsdp4_fd65536_20260915/10000
      --action-quality good
      --chunking-mode inference_time
    environment:
      ALOHA_TASK_1_PROMPT: twist off the bottle cap and rinse the bottle
      ALOHA_TASK_2_PROMPT: twist off the bottle cap and rinse the bottle
  openpi_server:
    command:
      - /bin/bash
      - -lc
      - >-
        uv run --no-sync scripts/serve_policy.py --no-warmup-subtask --denoising-steps 10
        --video-memory-num-frames 1 --video-memory-stride-seconds 1.0
        policy:checkpoint
        --policy.config eii_data_system_with_rinse_cam4_fullft_h200_from_april_original_30repo
        --policy.dir /app/checkpoints/eii_data_system_with_rinse_cam4_fullft_h200_from_april_original_30repo/rinse_cam4_april_30repo_44entries_448_bs64_ga4_scan_nw96_fsdp4_fd65536_20260915/10000
