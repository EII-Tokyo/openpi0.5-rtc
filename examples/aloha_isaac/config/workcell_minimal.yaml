stage:
  units: meters
  up_axis: Z
  output_usd: local_eval_assets/aloha_isaac_minimal/aloha_workcell.usd

assets:
  # Generated by scripts/convert_mjcf_to_usd.py or Isaac Sim's GUI importer.
  aloha_usd: local_eval_assets/aloha_isaac_assets/aloha_viperx.usd
  load_aloha_if_exists: true
  # Stage-0 workaround: Isaac's MJCF importer currently exports only one arm
  # from the dual-arm Gym ALOHA MJCF, so show a dual-arm workcell by referencing
  # the imported single-arm USD twice.
  instance_single_arm_usd_twice: true

table:
  prim_path: /World/Table
  size: [1.20, 0.80, 0.04]
  pose:
    translation: [0.0, 0.45, 0.0]
    rotation_rpy_deg: [0.0, 0.0, 0.0]
  color: [0.18, 0.18, 0.18]

table_frame:
  prim_path: /World/TableFrameT
  pose:
    translation: [0.0, 0.35, 0.045]
    rotation_rpy_deg: [0.0, 0.0, 0.0]
  axis_length: 0.25
  axis_radius: 0.008

robot_layout:
  # First rough layout only. Replace with measured base-to-table transforms.
  left_base:
    prim_path: /World/Aloha/left_base_hint
    translation: [-0.28, 0.45, 0.05]
    rotation_rpy_deg: [0.0, 0.0, 0.0]
  right_base:
    prim_path: /World/Aloha/right_base_hint
    translation: [0.28, 0.45, 0.05]
    rotation_rpy_deg: [0.0, 0.0, 0.0]

robot_instances:
  left_arm:
    prim_path: /World/Aloha/LeftArm
    translation: [0.0, 0.0, 0.0]
    rotation_rpy_deg: [0.0, 0.0, 0.0]
  right_arm:
    prim_path: /World/Aloha/RightArm
    # Mirror the imported left-arm USD around the table centerline. This is a
    # visual bootstrap, not a calibrated base transform.
    translation: [0.0, 1.0, 0.0]
    rotation_rpy_deg: [0.0, 0.0, 180.0]

pipe_placeholder:
  prim_path: /World/PipePlaceholder
  # Red placeholder line. Replace after measuring water-pipe entrance and axis.
  start: [0.45, 0.58, 0.36]
  end: [0.25, 0.45, 0.22]
  radius: 0.018
  color: [1.0, 0.05, 0.05]

cameras:
  cam_low:
    prim_path: /World/Cameras/cam_low
    translation: [0.0, 0.05, 0.55]
    target: [0.25, 0.45, 0.18]
    focal_length: 18.0
  cam_right_wrist:
    prim_path: /World/Cameras/cam_right_wrist_hint
    translation: [0.36, 0.36, 0.34]
    target: [0.25, 0.45, 0.18]
    focal_length: 18.0

replay:
  default_hdf5: /home/eii/data/openpi0.5-rtc-reward-learning/rollouts/key_regions/twist_off_the_bottle_cap/2026-07-08/warmup/key_region_00d1891748c74b5d8556a9ab153c8ec6/episode.hdf5
  qpos_dataset: observations/qpos
  qpos_order: [left_arm_6, left_gripper, right_arm_6, right_gripper]
