version: 1
scope: phase110_negative_control
default_decision: deny
notes: >
  Conservative workcell contact policy for ALOHA1 BottleUSD replay gates.
  This policy is intentionally strict: broad workcell_or_environment contacts
  must be mapped to explicit task semantics before they can pass a final gate.

rules:
  - path_prefix: /World/PipePlaceholder
    semantic_class: candidate_measured_pipe_contact
    decision: allow
    notes: >
      The measured-workcell pipe placeholder is the intended insertion target.
      Contacts with this namespace should not be rejected as generic
      workcell/environment collisions. This is still a candidate semantic rule:
      it does not prove successful insertion without calibrated pose and
      trajectory/contact validation.

  - path_prefix: /World/Table
    semantic_class: measured_table_contact_not_yet_task_valid
    decision: deny
    notes: >
      The measured table overlay is real workcell geometry, but table contact
      is not task-valid for the current already-grasped bottle-in-pipe gates.
      Keep it denied until a separate calibrated pregrasp/table-support phase
      distinguishes normal support from bottle drop or drag failure.

  - path_prefix: /scene/worldBody/__22
    semantic_class: denied_frame_rail_collision
    decision: deny
    notes: >
      Phase109 identified this as a 1.22 m long, 2 cm thick frame/rail
      collider. Bottle contact with this rail is not equivalent to calibrated
      tabletop support.

  - path_prefix: /scene/worldBody/table
    semantic_class: candidate_table_prim_not_full_measured_table
    decision: deny
    notes: >
      The named table prim exists, but Phase109 measured its bbox at about
      0.744 m x 0.274 m x 0.02 m, not the full measured table. Keep denied
      until table-to-base calibration and tabletop semantics are completed.
