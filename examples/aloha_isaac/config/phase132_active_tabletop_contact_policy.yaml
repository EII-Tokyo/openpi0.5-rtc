version: 1
scope: phase132_active_tabletop_bottle_grasp
default_decision: deny
notes: >
  Workcell contact policy for the active tabletop BottleUSD visual +
  cylinder physics proxy grasp gate. This gate allows tabletop support for
  the bottle proxy, but keeps frame, rail, pipe, robot body, and unknown
  workcell contacts denied unless a later task-specific policy explicitly
  promotes them.

rules:
  - path_prefix: /World/phase58_local_object_support_patch
    semantic_class: diagnostic_local_object_support_patch
    decision: allow
    notes: >
      Diagnostic-only local support patch under the bottle. It isolates bottle
      grasp closure from global table/base collision calibration and must not
      be treated as final full-workcell table validation.

  - path_prefix: /World/phase58_contact_geometry_support_patch
    semantic_class: diagnostic_contact_geometry_support_patch
    decision: allow
    notes: >
      Diagnostic-only local support patch sized from the physical contact
      geometry rather than the full visual bottle bbox. It must not be treated
      as final full-workcell table validation.

  - path_prefix: /World/Table
    semantic_class: active_tabletop_support
    decision: allow
    notes: >
      User-measured table collider in the confirmed ALOHA workcell overlay.
      Active tabletop bottle-body grasp gates should use this table as the
      object support surface instead of a phase-local hard-coded support plane.

  - path_prefix: /scene/worldBody/table
    semantic_class: active_tabletop_support
    decision: allow
    notes: >
      Phase134 showed the bottle physics proxy resting on this table collider
      while the left gripper closed onto the bottle body. This is allowed only
      for the active tabletop pregrasp/grasp gate.

  - path_prefix: /scene/worldBody/__22
    semantic_class: denied_frame_rail_collision
    decision: deny
    notes: >
      Phase109 identified this path family as frame/rail geometry. Bottle
      contact here must not count as tabletop support.

  - path_prefix: /World/PipePlaceholder
    semantic_class: denied_pipe_contact_for_pregrasp_gate
    decision: deny
    notes: >
      Pipe contact is not part of this active tabletop bottle-body grasp gate.
      It belongs to a later insertion task gate.
