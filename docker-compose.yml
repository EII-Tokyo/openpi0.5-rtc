name: openpi_reward_learning_eii

services:
  runtime:
    image: lyl472324464/robot:aloha-ros1.0
    profiles:
      - legacy
    depends_on:
      - aloha_ros_nodes
      - ros_master
      - openpi_server
    # build:
    #   context: .
    #   dockerfile: examples/aloha_real/Dockerfile
    command: >-
      python3 /app/examples/aloha_real/main.py
      --model-dir
      /app/checkpoints/eii_rinse_11repo_cam4_fullft/rinse_11repo_insertx5_fullft_bs256_nw64_fsdp8_20260513/9000
      --dataset-dir
      /app/rollouts/old_policy/unscrew_bottle_cap/2026-05-27
      --num-episodes
      1
      --max-episode-steps
      100000
      --hdf5-max-buffer-seconds
      0
      --split-hdf5-on-reset
      --save-format
      video_hdf5
      --video-codec
      h264
      --action-quality
      normal

    init: true
    tty: true
    network_mode: host
    privileged: true
    volumes:
      - $PWD:/app
      - /data/openpi0.5-rtc-reward-learning/rollouts:/app/rollouts
      - /home/eii/openpi0.5-rtc-reward-learning/checkpoints:/app/checkpoints:ro
    environment:
      - RLT_RL_TOKEN_CHECKPOINT_PATH=${RLT_RL_TOKEN_CHECKPOINT_PATH:-/app/checkpoints/rlt_lower_right_rl_token_ablation_20260701/BEST/checkpoint}

  rlt_warmup_runtime:
    image: openpi_reward_learning_eii/rlt_warmup_runtime:reward-learning
    build:
      context: .
      dockerfile: scripts/docker/rlt_warmup_runtime.Dockerfile
    profiles:
      - rlt
    depends_on:
      - aloha_ros_nodes
      - ros_master
      - openpi_server
      - redis
      - eii_pilot_backend
      - eii_pilot_frontend
    command: >-
      python3 /app/examples/aloha_real/main.py
      --model-dir
      /app/checkpoints/eii_rinse_11repo_cam4_fullft/rinse_11repo_insertx5_fullft_bs256_nw64_fsdp8_20260513/9000
      --num-episodes
      1
      --max-episode-steps
      100000
      --save-format
      video_hdf5_and_rlt_key_region
      --rlt-rollouts-root
      /app/rollouts
      --rlt-replay-root
      /app/replay
      --rlt-train-horizon
      10
      --rlt-full-horizon
      50
      --rlt-chunk-stride
      2
      --video-codec
      h264
      --action-quality
      normal
    init: true
    tty: true
    stdin_open: true
    network_mode: host
    gpus: all
    privileged: true
    volumes:
      - $PWD:/app
      - /data/openpi0.5-rtc-reward-learning/rollouts:/app/rollouts
      - /data/openpi0.5-rtc-reward-learning/replay:/app/replay
      - /home/eii/openpi0.5-rtc-reward-learning/checkpoints:/app/checkpoints:ro
    environment:
      - RLT_RL_TOKEN_CHECKPOINT_PATH=${RLT_RL_TOKEN_CHECKPOINT_PATH:-/app/checkpoints/rlt_lower_right_rl_token_ablation_20260701/BEST/checkpoint}
      - RLT_ACTOR_CHECKPOINT_PATH=${RLT_ACTOR_CHECKPOINT_PATH:-}
      - RLT_DEFAULT_CRITIC_GATE_ENABLED=${RLT_DEFAULT_CRITIC_GATE_ENABLED:-1}
      - PYTHONPATH=/app:/app/src:/app/packages/openpi-client/src
      - JAX_PLATFORMS=cuda
      - XLA_PYTHON_CLIENT_PREALLOCATE=false
      - XLA_PYTHON_CLIENT_MEM_FRACTION=0.25
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,video

  rlt_online_trainer:
    image: openpi_reward_learning_eii/openpi_server:reward-learning
    build:
      context: .
      dockerfile: scripts/docker/serve_policy.Dockerfile
    profiles:
      - train
    depends_on:
      - redis
      - eii_pilot_backend
    command:
      - /bin/bash
      - -lc
      - >-
        uv run --no-sync scripts/train_rlt_online.py
        --replay-dir /app/replay/rlt_key_regions
        --output-dir /app/rlt_online/run
        --segment-db-path /app/segment_db/segments.sqlite3
        ${RLT_ONLINE_TRAIN_MANIFEST:+--manifest-path ${RLT_ONLINE_TRAIN_MANIFEST}}
        ${RLT_ONLINE_HOLDOUT_MANIFEST:+--holdout-manifest-path ${RLT_ONLINE_HOLDOUT_MANIFEST}}
        --recursive-scan
        --expected-replay-action-horizon ${RLT_EXPECTED_REPLAY_ACTION_HORIZON:-10}
        --train-action-horizon ${RLT_TRAIN_ACTION_HORIZON:-10}
        --min-replay-samples ${RLT_MIN_REPLAY_SAMPLES:-2048}
        --min-replay-shards ${RLT_MIN_REPLAY_SHARDS:-40}
        --min-success-episodes ${RLT_MIN_SUCCESS_EPISODES:-10}
        --min-failure-episodes ${RLT_MIN_FAILURE_EPISODES:-10}
        --critic-burn-in-steps ${RLT_CRITIC_BURN_IN_STEPS:-1000}
        --online-safety-enabled
        --online-min-new-shards-per-round ${RLT_ONLINE_MIN_NEW_SHARDS_PER_ROUND:-10}
        --online-min-new-success-per-round ${RLT_ONLINE_MIN_NEW_SUCCESS_PER_ROUND:-5}
        --online-min-new-failure-per-round ${RLT_ONLINE_MIN_NEW_FAILURE_PER_ROUND:-5}
        --online-critic-updates-per-round ${RLT_ONLINE_CRITIC_UPDATES_PER_ROUND:-500}
        --online-actor-updates-per-round ${RLT_ONLINE_ACTOR_UPDATES_PER_ROUND:-300}
        --online-critic-auc-min ${RLT_ONLINE_CRITIC_AUC_MIN:-0.70}
        --online-critic-max-auc-drop ${RLT_ONLINE_CRITIC_MAX_AUC_DROP:-0.02}
        --online-require-positive-q-gap
        --online-actor-max-delta-norm ${RLT_ONLINE_ACTOR_MAX_DELTA_NORM:-0.09}
        --online-actor-min-q-advantage ${RLT_ONLINE_ACTOR_MIN_Q_ADVANTAGE:-0.0}
        --online-beta-initial ${RLT_ONLINE_BETA_INITIAL:-30.0}
        --online-beta-min ${RLT_ONLINE_BETA_MIN:-5.0}
        --online-beta-max ${RLT_ONLINE_BETA_MAX:-30.0}
        --online-beta-decay-on-actor-accept ${RLT_ONLINE_BETA_DECAY_ON_ACTOR_ACCEPT:-0.9}
        --online-beta-increase-on-reject ${RLT_ONLINE_BETA_INCREASE_ON_REJECT:-1.25}
        --online-target-delta-initial ${RLT_ONLINE_TARGET_DELTA_INITIAL:-0.04}
        --online-target-delta-max ${RLT_ONLINE_TARGET_DELTA_MAX:-0.10}
        --online-target-delta-increment ${RLT_ONLINE_TARGET_DELTA_INCREMENT:-0.01}
        --auto-beta-enabled
        --auto-beta-target-delta-norm ${RLT_AUTO_BETA_TARGET_DELTA_NORM:-0.06}
        --auto-beta-min ${RLT_AUTO_BETA_MIN:-1.0}
        --auto-beta-max ${RLT_AUTO_BETA_MAX:-30.0}
        --auto-beta-lr ${RLT_AUTO_BETA_LR:-0.03}
        --auto-beta-ema-decay ${RLT_AUTO_BETA_EMA_DECAY:-0.80}
        --auto-beta-update-interval ${RLT_AUTO_BETA_UPDATE_INTERVAL:-100}
        --auto-beta-q-margin ${RLT_AUTO_BETA_Q_MARGIN:-0.01}
        --actor-min-replay-samples ${RLT_ACTOR_MIN_REPLAY_SAMPLES:-4096}
        --actor-min-replay-shards ${RLT_ACTOR_MIN_REPLAY_SHARDS:-40}
        --actor-min-success-episodes ${RLT_ACTOR_MIN_SUCCESS_EPISODES:-20}
        --actor-min-failure-episodes ${RLT_ACTOR_MIN_FAILURE_EPISODES:-20}
        --batch-size ${RLT_BATCH_SIZE:-64}
        --policy-delay ${RLT_POLICY_DELAY:-2}
        --critic-loss-mode ${RLT_CRITIC_LOSS_MODE:-td3}
        --conservative-alpha ${RLT_CONSERVATIVE_ALPHA:-0.0}
        --log-interval ${RLT_LOG_INTERVAL:-50}
        --save-interval ${RLT_SAVE_INTERVAL:-1000}
        --actor-publish-interval ${RLT_ACTOR_PUBLISH_INTERVAL:-1000}
        --scan-interval ${RLT_SCAN_INTERVAL:-1.0}
        --wait-sleep-seconds ${RLT_WAIT_SLEEP_SECONDS:-1.0}
        --no-wandb-enabled
        --wandb-project ${WANDB_PROJECT:-openpi-rlt-online}
        --wandb-run-name ${WANDB_RUN_NAME:-rlt_actor_critic_online}
        --redis-enabled
        --redis-host ${REDIS_HOST:-localhost}
        --redis-port ${REDIS_PORT:-6379}
        --redis-db ${REDIS_DB:-0}
        --redis-state-channel ${RLT_STATE_CHANNEL:-aloha_rlt_state}
        --redis-control-channel ${RLT_CONTROL_CHANNEL:-aloha_rlt_control}
        ${RLT_INIT_INFERENCE_ACTOR_CHECKPOINT:+--init-inference-actor-checkpoint ${RLT_INIT_INFERENCE_ACTOR_CHECKPOINT}}
        --online-treat-initial-replay-as-committed
        ${RLT_ONLINE_INITIAL_COMMITTED_SHARDS:+--online-initial-committed-shards ${RLT_ONLINE_INITIAL_COMMITTED_SHARDS}}
    init: true
    tty: true
    network_mode: host
    volumes:
      - $PWD:/app
      - /data/openpi0.5-rtc-reward-learning/replay:/app/replay
      - /data/openpi0.5-rtc-reward-learning/rlt_online:/app/rlt_online
      - /data/openpi0.5-rtc-reward-learning/segment_db:/app/segment_db
      - ${OPENPI_DATA_HOME:-~/.cache/openpi}:/openpi_assets
    environment:
      - GIT_LFS_SKIP_SMUDGE=1
      - XLA_PYTHON_CLIENT_PREALLOCATE=false
      - XLA_PYTHON_CLIENT_MEM_FRACTION=0.4
      - OPENPI_DATA_HOME=/openpi_assets
      - WANDB_API_KEY=${WANDB_API_KEY:-}
      - WANDB_PROJECT=${WANDB_PROJECT:-openpi-rlt-online}
      - WANDB_RUN_NAME=${WANDB_RUN_NAME:-rlt_actor_critic_online}
      - IS_DOCKER=true
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - UV_PROJECT_ENVIRONMENT=/.venv
      - VIRTUAL_ENV=/.venv
      - UV_NO_SYNC=1
      - UV_NO_DEV=1
      - PYTHONPATH=/app/src
      - REDIS_HOST=${REDIS_HOST:-localhost}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_DB=${REDIS_DB:-0}
      - RLT_STATE_CHANNEL=${RLT_STATE_CHANNEL:-aloha_rlt_state}
      - RLT_SEGMENT_DB_PATH=/app/segment_db/segments.sqlite3
      - RLT_RL_TOKEN_CHECKPOINT_PATH=${RLT_RL_TOKEN_CHECKPOINT_PATH:-/app/checkpoints/rlt_lower_right_rl_token_ablation_20260701/BEST/checkpoint}
    gpus: all

  aloha_ros_nodes:
    image: lyl472324464/robot:aloha-ros1.0
    depends_on:
      - ros_master
    # build:
    #   context: .
    #   dockerfile: examples/aloha_real/Dockerfile
    init: true
    tty: true
    network_mode: host
    privileged: true
    volumes:
      - /dev:/dev
      - /home/eii/openpi0.5-rtc/third_party/aloha:/root/interbotix_ws/src/aloha
    command: roslaunch --wait aloha ros_nodes.launch

  ros_master:
    image: ros:noetic-robot
    network_mode: host
    privileged: true
    command:
      - roscore

  openpi_server:
    image: openpi_reward_learning_eii/openpi_server:reward-learning
    build:
      context: .
      dockerfile: scripts/docker/serve_policy.Dockerfile
    command:
      - /bin/bash
      - -lc
      - >-
        uv run --no-sync scripts/serve_policy.py --no-warmup-subtask
        --no-warmup-non-rtc
        ${SERVER_ARGS:---video-memory-num-frames 1
        --video-memory-stride-seconds 1.0
        policy:checkpoint
        --policy.config eii_rinse_11repo_cam4_fullft
        --policy.dir
        /app/checkpoints/eii_rinse_11repo_cam4_fullft/rinse_11repo_insertx5_fullft_bs256_nw64_fsdp8_20260513/9000}
    init: true
    tty: true
    network_mode: host
    volumes:
      - $PWD:/app
      - /home/eii/openpi0.5-rtc-reward-learning/checkpoints:/app/checkpoints:ro
      - ${OPENPI_DATA_HOME:-~/.cache/openpi}:/openpi_assets
      - ${OPENPI_JAX_CACHE_DIR:-./.jax_cache/openpi_server}:/app/.jax_cache
    environment:
      - GIT_LFS_SKIP_SMUDGE=1
      - XLA_PYTHON_CLIENT_PREALLOCATE=false
      - XLA_PYTHON_CLIENT_MEM_FRACTION=0.4
      - SERVER_ARGS
      - OPENPI_DATA_HOME=/openpi_assets
      - JAX_COMPILATION_CACHE_DIR=/app/.jax_cache
      - JAX_PERSISTENT_CACHE_MIN_COMPILE_TIME_SECS=0
      - JAX_PERSISTENT_CACHE_MIN_ENTRY_SIZE_BYTES=-1
      - JAX_PERSISTENT_CACHE_ENABLE_XLA_CACHES=xla_gpu_per_fusion_autotune_cache_dir
      - IS_DOCKER=true
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - UV_PROJECT_ENVIRONMENT=/.venv
      - VIRTUAL_ENV=/.venv
      - UV_NO_SYNC=1
      - UV_NO_DEV=1
      - PYTHONPATH=/app/src
      - RLT_RL_TOKEN_CHECKPOINT_PATH=${RLT_RL_TOKEN_CHECKPOINT_PATH:-/app/checkpoints/rlt_lower_right_rl_token_ablation_20260701/BEST/checkpoint}
      - RLT_SAME_FORWARD_RL_TOKEN_ENABLED=${RLT_SAME_FORWARD_RL_TOKEN_ENABLED:-1}
      - RLT_SAME_FORWARD_RL_TOKEN_CONFIG=${RLT_SAME_FORWARD_RL_TOKEN_CONFIG:-eii_rinse_11repo_cam4_fullft_rl_token_lower_right_query_4layer}
      - RLT_SAME_FORWARD_RL_TOKEN_CHECKPOINT_PATH=${RLT_SAME_FORWARD_RL_TOKEN_CHECKPOINT_PATH:-/app/checkpoints/rlt_lower_right_rl_token_ablation_20260701/BEST/checkpoint}
    gpus: all

  rlt_token_server:
    image: openpi_reward_learning_eii/openpi_server:reward-learning
    build:
      context: .
      dockerfile: scripts/docker/serve_policy.Dockerfile
    profiles:
      - rlt
    command:
      - /bin/bash
      - -lc
      - >-
        uv run --no-sync scripts/serve_policy.py --port 8002
        --no-warmup-rtc
        --no-warmup-non-rtc
        --no-warmup-subtask
        --video-memory-num-frames 1
        --video-memory-stride-seconds 1.0
        policy:checkpoint
        --policy.config eii_rinse_11repo_cam4_fullft_rl_token_lower_right_query_4layer
        --policy.dir
        /app/checkpoints/rlt_lower_right_rl_token_ablation_20260701/BEST/checkpoint
    init: true
    tty: true
    network_mode: host
    volumes:
      - $PWD:/app
      - /home/eii/openpi0.5-rtc-reward-learning/checkpoints:/app/checkpoints:ro
      - ${OPENPI_DATA_HOME:-~/.cache/openpi}:/openpi_assets
      - ${RLT_TOKEN_JAX_CACHE_DIR:-./.jax_cache/rlt_token_server}:/app/.jax_cache
    environment:
      - GIT_LFS_SKIP_SMUDGE=1
      - XLA_PYTHON_CLIENT_PREALLOCATE=false
      - XLA_PYTHON_CLIENT_MEM_FRACTION=0.35
      - OPENPI_DATA_HOME=/openpi_assets
      - JAX_COMPILATION_CACHE_DIR=/app/.jax_cache
      - JAX_PERSISTENT_CACHE_MIN_COMPILE_TIME_SECS=0
      - JAX_PERSISTENT_CACHE_MIN_ENTRY_SIZE_BYTES=-1
      - JAX_PERSISTENT_CACHE_ENABLE_XLA_CACHES=xla_gpu_per_fusion_autotune_cache_dir
      - IS_DOCKER=true
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - UV_PROJECT_ENVIRONMENT=/.venv
      - VIRTUAL_ENV=/.venv
      - UV_NO_SYNC=1
      - UV_NO_DEV=1
      - PYTHONPATH=/app/src
      - RLT_RL_TOKEN_CHECKPOINT_PATH=${RLT_RL_TOKEN_CHECKPOINT_PATH:-/app/checkpoints/rlt_lower_right_rl_token_ablation_20260701/BEST/checkpoint}
    gpus: all

  redis:
    image: redis:7.4.2
    restart: always
    network_mode: "host"
    healthcheck:
      test:  ["CMD", "redis-cli" ,"ping"]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 2s

  eii_pilot_backend:
    image: openpi_reward_learning_eii/eii_pilot_backend:reward-learning
    build:
      context: .
      dockerfile: voice_assistant_web/backend/Dockerfile
    restart: always
    network_mode: "host"
    privileged: true
    init: true
    tty: true
    volumes:
      - $PWD:/app
      - /data/openpi0.5-rtc-reward-learning/rollouts:/app/rollouts
      - /data/openpi0.5-rtc-reward-learning/replay:/app/replay
      - /data/openpi0.5-rtc-reward-learning/rlt_online:/app/rlt_online:ro
      - /data/openpi0.5-rtc-reward-learning/segment_db:/app/segment_db
      - /dev:/dev
    env_file:
      - ./voice_assistant_web/.env
    environment:
      - REDIS_HOST=${REDIS_HOST:-localhost}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_DB=${REDIS_DB:-0}
      - ROLLOUTS_ROOT=/app/rollouts
      - REPLAY_ROOT=/app/replay
      - RLT_ONLINE_RUN_ROOT=/app/rlt_online/run
      - RLT_STATE_PATH=/app/segment_db/rlt_control_state.json
      - RLT_SEGMENT_DB_PATH=/app/segment_db/segments.sqlite3
      - RLT_RL_TOKEN_CHECKPOINT_PATH=${RLT_RL_TOKEN_CHECKPOINT_PATH:-/app/checkpoints/rlt_lower_right_rl_token_ablation_20260701/BEST/checkpoint}
      - EII_CAMERA_TRANSPORT=${EII_CAMERA_TRANSPORT:-webrtc}
      - EII_CAMERA_WEBRTC_ENABLED=${EII_CAMERA_WEBRTC_ENABLED:-true}
      - EII_REALTIME_INCLUDE_CAMERA_FRAMES=${EII_REALTIME_INCLUDE_CAMERA_FRAMES:-false}
      - EII_CAMERA_WEBRTC_MEDIA_URL=${EII_CAMERA_WEBRTC_MEDIA_URL:-http://127.0.0.1:8013}
    depends_on:
      - redis

  eii_pilot_frontend:
    image: openpi_reward_learning_eii/eii_pilot_frontend:reward-learning
    build:
      context: .
      dockerfile: voice_assistant_web/frontend/Dockerfile
    restart: always
    network_mode: "host"
    init: true
    tty: true
    volumes:
      - $PWD/voice_assistant_web/frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - eii_pilot_backend
      - eii_pilot_webrtc_media

  eii_pilot_webrtc_media:
    image: openpi_reward_learning_eii/eii_pilot_webrtc_media:reward-learning
    build:
      context: .
      dockerfile: voice_assistant_web/webrtc_media/Dockerfile
    restart: unless-stopped
    network_mode: "host"
    gpus: all
    init: true
    tty: true
    volumes:
      - $PWD:/app
    environment:
      - PYTHONPATH=/app
      - EII_WEBRTC_MEDIA_PORT=8013
      - EII_WEBRTC_ENCODER=nvenc
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=video,utility
    depends_on:
      - ros_master
