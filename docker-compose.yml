x-checkpoint-dir: &checkpoint_dir "${OPENPI_CHECKPOINT_DIR:-/app/checkpoints/eii_with_rinse_cam4_fullft_jialong44_h200nvlx4_224_mosaic_pool256_bs128_ga2_nw128_20261104/jialong44_h200nvlx4_bs128_ga2_nw128_20261104/14999}"
services:
  runtime:
    image: lyl472324464/robot:aloha-ros1.0
    depends_on:
      - aloha_ros_nodes
      - ros_master
      - openpi_server
    # build:
    #   context: .
    #   dockerfile: src/openpi/robot/aloha_real/Dockerfile
    command: ["python3", "/app/scripts/run_aloha_real.py", "--model-dir", *checkpoint_dir, "--host", "127.0.0.1", "--port", "8001", "--policy-hz", "50", "--chunking-mode", "inference_time", "--rtc-handoff-delay-steps", "10"]

    init: true
    tty: true
    network_mode: host
    privileged: true
    # Match collect.sh: expose the NVENC driver libraries to the recording worker.
    gpus: all
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,video
      ALOHA_ROLLOUT_DIR: /collection-data
      # Match the task text in the rinse69 training datasets exactly.
      ALOHA_TASK_1_PROMPT: twist off the bottle cap and rinse the bottle
      ALOHA_TASK_2_PROMPT: twist off the bottle cap and rinse the bottle
    volumes:
      - $PWD:/app
      - /home/eii/openpi0.5-rtc/checkpoints:/app/checkpoints:ro
      # Canonical collector/web browser root; existing recordings are not moved.
      - /home/eii/aloha-2.0/aloha_data/aloha_stationary:/collection-data

  aloha_ros_nodes:
    image: lyl472324464/robot:aloha-ros1.0
    depends_on:
      - ros_master
    # build:
    #   context: .
    #   dockerfile: src/openpi/robot/aloha_real/Dockerfile
    init: true
    tty: true
    network_mode: host
    privileged: true
    volumes:
      - /dev:/dev
      - $PWD/third_party/aloha:/root/interbotix_ws/src/aloha
    command: roslaunch --wait aloha ros_nodes.launch

  ros_master:
    image: ros:noetic-robot
    network_mode: host
    privileged: true
    command:
      - roscore

  openpi_server:
    image: lyl472324464/robot:openpi_server
    build:
      context: .
      dockerfile: scripts/docker/serve_policy.Dockerfile
    entrypoint: ["/.venv/bin/python3"]
    command: ["/app/scripts/serve_policy.py", "--model-dir", *checkpoint_dir, "--port", "8001", "--no-warmup-subtask"]
    init: true
    tty: true
    network_mode: host
    volumes:
      - $PWD:/app
      - /home/eii/openpi0.5-rtc/checkpoints:/app/checkpoints:ro
      - ${OPENPI_DATA_HOME:-~/.cache/openpi}:/openpi_assets
    environment:
      - GIT_LFS_SKIP_SMUDGE=1
      - XLA_PYTHON_CLIENT_PREALLOCATE=false
      - XLA_PYTHON_CLIENT_MEM_FRACTION=0.9
      - SERVER_ARGS
      - OPENPI_DATA_HOME=/openpi_assets
      - IS_DOCKER=true
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - UV_PROJECT_ENVIRONMENT=/.venv
      - VIRTUAL_ENV=/.venv
      - UV_NO_SYNC=1
      - UV_NO_DEV=1
      - PYTHONPATH=/app/src
    gpus: all

  redis:
    image: redis:7.4.2
    restart: always
    network_mode: "host"
    healthcheck:
      test:  ["CMD", "redis-cli" ,"ping"]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 2s

  voice_web_backend:
    image: voice_assistant_web_backend
    build:
      context: .
      dockerfile: voice_assistant_web/backend/Dockerfile
    restart: always
    network_mode: "host"
    privileged: true
    init: true
    tty: true
    volumes:
      - $PWD:/app
      - /dev:/dev
    env_file:
      - ./voice_assistant_web/.env
    environment:
      - REDIS_HOST=${REDIS_HOST:-localhost}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_DB=${REDIS_DB:-0}
    depends_on:
      - redis

  voice_web_frontend:
    image: voice_assistant_web_frontend
    build:
      context: .
      dockerfile: voice_assistant_web/frontend/Dockerfile
    restart: always
    network_mode: "host"
    init: true
    tty: true
    volumes:
      - $PWD/voice_assistant_web/frontend:/app
      - /app/node_modules
    depends_on:
      - voice_web_backend
