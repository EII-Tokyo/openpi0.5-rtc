name: openpi_reward_learning_eii

services:
  runtime:
    image: lyl472324464/robot:aloha-ros1.0
    depends_on:
      - aloha_ros_nodes
      - ros_master
      - openpi_server
    # build:
    #   context: .
    #   dockerfile: examples/aloha_real/Dockerfile
    command: >-
      python3 /app/examples/aloha_real/main.py
      --model-dir
      /app/checkpoints/eii_data_system_without_rinse_cam3_fullft_h200_return_home_29repo_rl_token_query/rl_token_2048_enc4_dec4_query_from_19000_20260528/12000
      --dataset-dir
      /app/rollouts/old_policy/unscrew_bottle_cap/2026-05-27
      --num-episodes
      1
      --max-episode-steps
      100000
      --hdf5-max-buffer-seconds
      0
      --split-hdf5-on-reset
      --save-format
      video_hdf5
      --video-codec
      h264
      --action-quality
      normal

    init: true
    tty: true
    network_mode: host
    privileged: true
    volumes:
      - $PWD:/app
      - /data/openpi0.5-rtc-reward-learning/rollouts:/app/rollouts
      - $PWD/checkpoints:/app/checkpoints:ro
    environment:
      - RLT_RL_TOKEN_CHECKPOINT_PATH=/app/checkpoints/eii_data_system_without_rinse_cam3_fullft_h200_return_home_29repo_rl_token_query/rl_token_2048_enc4_dec4_query_from_19000_20260528/12000

  rlt_warmup_runtime:
    image: lyl472324464/robot:aloha-ros1.0
    profiles:
      - rlt
    depends_on:
      - aloha_ros_nodes
      - ros_master
      - openpi_server
      - redis
      - eii_pilot_backend
      - eii_pilot_frontend
    command: >-
      python3 /app/examples/aloha_real/main.py
      --model-dir
      /app/checkpoints/eii_data_system_without_rinse_cam3_fullft_h200_return_home_29repo_rl_token_query/rl_token_2048_enc4_dec4_query_from_19000_20260528/12000
      --num-episodes
      1
      --max-episode-steps
      100000
      --save-format
      video_hdf5_and_rlt_key_region
      --rlt-rollouts-root
      /app/rollouts
      --rlt-replay-root
      /app/replay
      --rlt-train-horizon
      10
      --rlt-full-horizon
      50
      --rlt-chunk-stride
      2
      --rlt-actor-path
      /app/rlt_online/inference_actor/LATEST
      --video-codec
      h264
      --action-quality
      normal
    init: true
    tty: true
    stdin_open: true
    network_mode: host
    privileged: true
    volumes:
      - $PWD:/app
      - /data/openpi0.5-rtc-reward-learning/rollouts:/app/rollouts
      - /data/openpi0.5-rtc-reward-learning/replay:/app/replay
      - /data/openpi0.5-rtc-reward-learning/rlt_online:/app/rlt_online
      - $PWD/checkpoints:/app/checkpoints:ro
    environment:
      - RLT_RL_TOKEN_CHECKPOINT_PATH=/app/checkpoints/eii_data_system_without_rinse_cam3_fullft_h200_return_home_29repo_rl_token_query/rl_token_2048_enc4_dec4_query_from_19000_20260528/12000

  rlt_online_trainer:
    image: openpi_reward_learning_eii/openpi_server:reward-learning
    build:
      context: .
      dockerfile: scripts/docker/serve_policy.Dockerfile
    profiles:
      - rlt
    depends_on:
      - redis
      - eii_pilot_backend
    command:
      - /bin/bash
      - -lc
      - >-
        uv run --no-sync scripts/train_rlt_online.py
        --replay-dir /app/replay/rlt_key_regions
        --output-dir /app/rlt_online
        --segment-db-path /app/segment_db/segments.sqlite3
        --recursive-scan
        --expected-replay-action-horizon ${RLT_EXPECTED_REPLAY_ACTION_HORIZON:-50}
        --train-action-horizon ${RLT_TRAIN_ACTION_HORIZON:-10}
        --min-replay-samples ${RLT_MIN_REPLAY_SAMPLES:-512}
        --min-success-episodes ${RLT_MIN_SUCCESS_EPISODES:-1}
        --min-failure-episodes ${RLT_MIN_FAILURE_EPISODES:-1}
        --critic-burn-in-steps ${RLT_CRITIC_BURN_IN_STEPS:-0}
        --actor-min-replay-samples ${RLT_ACTOR_MIN_REPLAY_SAMPLES:-1000}
        --actor-min-success-episodes ${RLT_ACTOR_MIN_SUCCESS_EPISODES:-5}
        --actor-min-failure-episodes ${RLT_ACTOR_MIN_FAILURE_EPISODES:-5}
        --batch-size ${RLT_BATCH_SIZE:-64}
        --policy-delay ${RLT_POLICY_DELAY:-2}
        --log-interval ${RLT_LOG_INTERVAL:-50}
        --save-interval ${RLT_SAVE_INTERVAL:-1000}
        --actor-publish-interval ${RLT_ACTOR_PUBLISH_INTERVAL:-500}
        --scan-interval ${RLT_SCAN_INTERVAL:-1.0}
        --wait-sleep-seconds ${RLT_WAIT_SLEEP_SECONDS:-1.0}
        --redis-enabled
        --redis-host ${REDIS_HOST:-localhost}
        --redis-port ${REDIS_PORT:-6379}
        --redis-db ${REDIS_DB:-0}
        --redis-state-channel ${RLT_STATE_CHANNEL:-aloha_rlt_state}
    init: true
    tty: true
    network_mode: host
    volumes:
      - $PWD:/app
      - /data/openpi0.5-rtc-reward-learning/replay:/app/replay
      - /data/openpi0.5-rtc-reward-learning/rlt_online:/app/rlt_online
      - /data/openpi0.5-rtc-reward-learning/segment_db:/app/segment_db
      - ${OPENPI_DATA_HOME:-~/.cache/openpi}:/openpi_assets
    environment:
      - GIT_LFS_SKIP_SMUDGE=1
      - XLA_PYTHON_CLIENT_PREALLOCATE=false
      - XLA_PYTHON_CLIENT_MEM_FRACTION=0.4
      - OPENPI_DATA_HOME=/openpi_assets
      - IS_DOCKER=true
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - UV_PROJECT_ENVIRONMENT=/.venv
      - VIRTUAL_ENV=/.venv
      - UV_NO_SYNC=1
      - UV_NO_DEV=1
      - PYTHONPATH=/app/src
      - REDIS_HOST=${REDIS_HOST:-localhost}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_DB=${REDIS_DB:-0}
      - RLT_STATE_CHANNEL=${RLT_STATE_CHANNEL:-aloha_rlt_state}
      - RLT_SEGMENT_DB_PATH=/app/segment_db/segments.sqlite3
    gpus: all

  aloha_ros_nodes:
    image: lyl472324464/robot:aloha-ros1.0
    depends_on:
      - ros_master
    # build:
    #   context: .
    #   dockerfile: examples/aloha_real/Dockerfile
    init: true
    tty: true
    network_mode: host
    privileged: true
    volumes:
      - /dev:/dev
      - /home/eii/openpi0.5-rtc/third_party/aloha:/root/interbotix_ws/src/aloha
    command: roslaunch --wait aloha ros_nodes.launch

  ros_master:
    image: ros:noetic-robot
    network_mode: host
    privileged: true
    command:
      - roscore

  openpi_server:
    image: openpi_reward_learning_eii/openpi_server:reward-learning
    build:
      context: .
      dockerfile: scripts/docker/serve_policy.Dockerfile
    command:
      - /bin/bash
      - -lc
      - >-
        uv run --no-sync scripts/serve_policy.py --no-warmup-subtask
        ${SERVER_ARGS:---video-memory-num-frames 1
        --video-memory-stride-seconds 1.0
        policy:checkpoint
        --policy.config eii_data_system_without_rinse_cam3_fullft_h200_return_home_29repo_rl_token_query
        --policy.dir
        /app/checkpoints/eii_data_system_without_rinse_cam3_fullft_h200_return_home_29repo_rl_token_query/rl_token_2048_enc4_dec4_query_from_19000_20260528/12000}
    init: true
    tty: true
    network_mode: host
    volumes:
      - $PWD:/app
      - $PWD/checkpoints:/app/checkpoints:ro
      - ${OPENPI_DATA_HOME:-~/.cache/openpi}:/openpi_assets
    environment:
      - GIT_LFS_SKIP_SMUDGE=1
      - XLA_PYTHON_CLIENT_PREALLOCATE=false
      - XLA_PYTHON_CLIENT_MEM_FRACTION=0.4
      - SERVER_ARGS
      - OPENPI_DATA_HOME=/openpi_assets
      - IS_DOCKER=true
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - UV_PROJECT_ENVIRONMENT=/.venv
      - VIRTUAL_ENV=/.venv
      - UV_NO_SYNC=1
      - UV_NO_DEV=1
      - PYTHONPATH=/app/src
      - RLT_RL_TOKEN_CHECKPOINT_PATH=/app/checkpoints/eii_data_system_without_rinse_cam3_fullft_h200_return_home_29repo_rl_token_query/rl_token_2048_enc4_dec4_query_from_19000_20260528/12000
    gpus: all

  redis:
    image: redis:7.4.2
    restart: always
    network_mode: "host"
    healthcheck:
      test:  ["CMD", "redis-cli" ,"ping"]
      interval: 3s
      timeout: 3s
      retries: 5
      start_period: 2s

  eii_pilot_backend:
    image: openpi_reward_learning_eii/eii_pilot_backend:reward-learning
    build:
      context: .
      dockerfile: voice_assistant_web/backend/Dockerfile
    restart: always
    network_mode: "host"
    privileged: true
    init: true
    tty: true
    volumes:
      - $PWD:/app
      - /data/openpi0.5-rtc-reward-learning/rollouts:/app/rollouts:ro
      - /data/openpi0.5-rtc-reward-learning/segment_db:/app/segment_db
      - /dev:/dev
    env_file:
      - ./voice_assistant_web/.env
    environment:
      - REDIS_HOST=${REDIS_HOST:-localhost}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_DB=${REDIS_DB:-0}
      - ROLLOUTS_ROOT=/app/rollouts
      - RLT_STATE_PATH=/app/segment_db/rlt_control_state.json
      - RLT_SEGMENT_DB_PATH=/app/segment_db/segments.sqlite3
    depends_on:
      - redis

  eii_pilot_frontend:
    image: openpi_reward_learning_eii/eii_pilot_frontend:reward-learning
    build:
      context: .
      dockerfile: voice_assistant_web/frontend/Dockerfile
    restart: always
    network_mode: "host"
    init: true
    tty: true
    volumes:
      - $PWD/voice_assistant_web/frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - eii_pilot_backend
