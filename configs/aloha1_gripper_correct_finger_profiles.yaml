      acceptance:
        - both fingers and the entire bottle contact band are visible
        - a nonzero gap exists on both bottle sides
        - camera anchor matches bilateral contact, release, and hold-end views
    bilateral_contact:
      object: custom fingers and fixed bottle after slow closure
      part: both fingers, inner contact bands, bottle, contact locations
      physical_stages:
        - bilateral_contact_established
      acceptance:
        - both fingers and bottle are simultaneously visible
        - the view exposes both finger-to-bottle interfaces
        - runtime contact data reports left and right contact
        - contact-focused and isometric views are not duplicates
    release_hold:
      object: unconstrained dynamic bottle held by both custom fingers
      part: both fingers, bottle, release and hold-end bottle pose
      physical_stages:
        - release
        - hold_end
      acceptance:
        - release and hold-end use the identical frozen camera anchor
        - both fingers and bottle remain visible
        - annotation reports exact runtime drop and velocity
        - release and hold-end are compared numerically even for subpixel motion
    collider_geometry:
      object: local PhysX-cooked custom finger collision geometry
      part: left and right finger overview and inner gripping region
      physical_stages:
        - offline_cooked_geometry
      acceptance:
        - both finger sides are shown side by side
