schema_version: 1
robot: Trossen Stationary ALOHA scene_base_link adapted for ALOHA1
dataset_convention: standard_aloha_14d
scope: left_arm_only_hdf5_replay_controller_ready
notes:
  - This mapping is for the Menagerie/Trossen /scene articulation, not the legacy /puppet_left_vx300s stage.
  - Right arm entries are intentionally omitted; callers must request side=left.
  - This is a controller-ready qpos replay mapping: it preserves the recorded ALOHA1 joint values and only renames DOFs.
  - It intentionally does not include Phase 9 FK rigid-alignment offsets, because those offsets can push /scene runtime joints outside PhysX articulation limits.
  - End-effector geometric alignment remains a separate calibration gate.
source_reports:
  - reports/aloha1_isaac_adaptation/phase20_dof_drive_limits_20260718/dof_drive_limits.md
  - reports/aloha1_isaac_adaptation/phase24_native_qpos_target_tracking_smoke_20260718/action_replay_metrics.json
  - reports/aloha1_isaac_adaptation/phase77_scene_proxy_hdf5_replay_target_limit_summary_20260718/gripper_passive_contact_metrics.json
controller_readiness:
  intended_gate: HDF5 target values must stay inside current /scene runtime DOF limits before controller tracking is evaluated.
  warning: This is not a complete world-frame or end-effector calibration.
