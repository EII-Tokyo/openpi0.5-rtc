retake_history:
  - attempt: sample_01_rejected_origin_only_attempt2
    status: REJECTED_SUBJECT_FRAMING
    reason: Origin-only closeup did not contain the complete supplier-CAD finger geometry.
  - attempt: sample_01_rejected_render_latency_attempt3
    status: REJECTED_STALE_RENDER
    reason: One paused app update did not converge the RGB render to the new camera pose.
  - attempt: sample_01_rejected_three_updates_attempt4
    status: REJECTED_STALE_RENDER
    reason: Three paused app updates still showed stale framing.
  - attempt: sample_02_invalid_wrong_initial_qpos
    status: INVALID_OPERATOR_INPUT_EXCLUDED
    reason: Wrong initial qpos was detected and interrupted before inclusion; it is not evidence for any sample.
  - attempt: sample_02_original
    status: REJECTED_CLOSEUP_OCCLUSION
    reason: The vertical frame occluded the supplier-CAD fingers after release.
  - attempt: final_selected_retakes
    status: PASS
    reason: Subject-bounds camera fit plus 20 paused render updates; runtime signatures match attempt10 and no physics parameters or steps changed.
