schema_version: 1
stage: A3_camera_semantic_skeleton
purpose: >
  Canonical ALOHA1 camera sensor identity registry for the clean Isaac USD.
  This file defines semantic sensor slots only. Intrinsics, extrinsics,
  render products, ROS bridge bindings, and training use are not enabled.

global_policy:
  source_type: MISSING
  calibration_status: MISSING
  render_eligible: false
  training_eligible: false
  ros_bridge_eligible: false
  openpi_capture_eligible: false
  notes:
    - UsdGeom.Camera prims exist so Isaac can distinguish real sensor prims from visual D405/mount meshes.
    - Camera prims are uncalibrated placeholders until measured intrinsics and extrinsics are applied.
    - D405 or camera mount visual assets must remain separate from these sensor prims.

cameras:
  cam_high:
    semantic_role: fixed_high_third_person
    parent_link: /aloha/cam_high_link
    color_frame_prim: /aloha/cam_high_link/cam_high_color_frame
    sensor_prim: /aloha/cam_high_link/cam_high_color_frame/cam_high
    usd_prim_type: Camera
    real_stream_name: MISSING
    dataset_key: MISSING
    openpi_obs_key: cam_high
    isaac_lab_sensor_key: cam_high
    intrinsics:
      status: MISSING
      source_type: MISSING
      value: null
    extrinsics:
      status: MISSING
      source_type: MISSING
      value: null
    render_product:
      status: NOT_CREATED
      value: null
    allowed_use:
      - semantic_identity
      - viewport_stage_tree_inspection
    forbidden_use:
      - training
      - openpi_runtime_capture
      - ros_bridge_publish
      - calibration_claim

  cam_low:
    semantic_role: fixed_low_third_person
    parent_link: /aloha/cam_low_link
    color_frame_prim: /aloha/cam_low_link/cam_low_color_frame
