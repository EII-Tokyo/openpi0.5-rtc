# Change this single path to switch both policy server and runtime together.
x-checkpoint-dir: &checkpoint_dir /app/checkpoints/eii_with_rinse_cam4_fullft_jialong_24repo_h200x8_224_high_mem5s4hz_mosaic2x2_pool256_bs256_ga1_nw200/rinse_jialong24_h200x8_224_cam4_high_mem5s4hz_mosaic2x2_pool256_bs256_ga1_nw200_20261026/5000
services:
  openpi_server:
    entrypoint: ["/.venv/bin/python3"]
    command:
      - /app/scripts/serve_policy.py
      - --model-dir
      - *checkpoint_dir
      - --port
      - "8001"
