# Change this single path to switch both policy server and runtime together.
x-checkpoint-dir: &checkpoint_dir /app/checkpoints/eii_with_rinse_cam4_fullft_jialong44_h200nvlx4_224_mosaic_pool256_bs128_ga2_nw128_20261104/jialong44_h200nvlx4_bs128_ga2_nw128_20261104/10000
services:
  openpi_server:
    entrypoint: ["/.venv/bin/python3"]
    command:
      - /app/scripts/serve_policy.py
      - --model-dir
      - *checkpoint_dir
      - --port
      - "8001"
      - --no-warmup-subtask
