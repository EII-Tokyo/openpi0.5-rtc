# Change this single path to switch both policy server and runtime together.
x-checkpoint-dir: &checkpoint_dir /app/checkpoints/eii_with_rinse_cam4_fullft_all_69repo_h100_448_high_mem5s4hz_mosaic2x2_pool256/rinse69_h100sxm4_448_high_mem5s4hz_mosaic2x2_pool256_bs64_ga4_20261025/10000
services:
  openpi_server:
    entrypoint: ["/.venv/bin/python3"]
    command:
      - /app/scripts/serve_policy.py
      - --model-dir
      - *checkpoint_dir
      - --port
      - "8001"
      - --no-warmup-subtask
  runtime:
    command:
      - python3
      - /app/scripts/run_aloha_real.py
      - --model-dir
      - *checkpoint_dir
      - --host
      - 127.0.0.1
      - --port
      - "8001"
      - --policy-hz
      - "50"
      - --chunking-mode
      - inference_time
      - --rtc-handoff-delay-steps
      - "10"
